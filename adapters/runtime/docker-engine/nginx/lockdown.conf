# Managed by the pac-engine (vendored 2026-09-20 from the former standalone deploykit
# repo) — do not edit manually
#
# Minimal fail-closed config, used only when DEPLOYKIT_REQUIRE_SSO=1 and no
# Azure App Registration is configured yet (see bootstrap-engine.sh step 7).
# Bind-mounted over the real pac-nginx image's /etc/nginx/conf.d/deploykit.conf
# on a second, throwaway "-lockdown" container that owns port 80 in this state,
# so the real pac-nginx container's own config never needs a runtime
# conditional for it. Everything except /health returns 401 with a branded page.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location = /unauthorized {
        root /usr/share/nginx/html;
        try_files /unauthorized.html =401;
    }

    location / {
        error_page 401 =401 /unauthorized;
        return 401;
    }
}
