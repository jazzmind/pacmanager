<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Not authorized</title>
<style>
  :root{--ink:#1e293b;--ink-muted:#64748b;--line:#e2e8f0;--canvas:#f0f4f8;--surface:#ffffff;--brand:#0078d6}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--canvas);color:var(--ink)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:40px;max-width:420px;text-align:center}
  h1{font-size:1.25rem;margin:0 0 8px}
  p{font-size:.9rem;color:var(--ink-muted);line-height:1.5;margin:0 0 20px}
  a{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;padding:10px 20px;border-radius:8px;font-size:.9rem;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <h1>Not authorized</h1>
    <p>You don't have access to this. If you're expecting to see an application here, ask its
    owner to share it with your account — otherwise this sandbox may not have sign-in configured
    yet.</p>
    <a href="/">Back to your apps</a>
  </div>
</body>
</html>
