# Managed by deploykit — do not edit manually
#
# No auth_request anywhere in this file. SSO (when enabled) is handled by
# oauth2-proxy running as the actual reverse proxy IN FRONT of this nginx
# (see bootstrap-sandbox.sh's oauth2-proxy block) — oauth2-proxy authenticates
# the browser itself and forwards the real request here with a normal
# X-Forwarded-Email header (--pass-user-headers), which per-app locations
# read directly ($http_x_forwarded_email) for their allowlist check (see
# proxy/nginx.py). nginx never makes a subrequest to check identity: that
# pattern (auth_request calling oauth2-proxy internally) was tried first and
# does not work in this nginx/Docker combination — verified exhaustively and
# independently reproduced on a second machine.
#
# When oauth2-proxy is in front, this container does not publish port 80 at
# all (network-internal only, reachable at deploykit-nginx:80). When SSO is
# disabled, this container owns port 80 directly, unchanged from before SSO
# existed. When SSO is required but not yet configured, a separate minimal
# "lockdown" nginx (nginx/lockdown.conf) owns port 80 instead of this
# container — see bootstrap-sandbox.sh step 7.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    # Branded page for a per-app ACL rejection (see proxy/nginx.py's
    # allowed_emails check, which does its own `error_page 403 = /unauthorized;`
    # + `return 403;` inline — no auth_request involved).
    location = /unauthorized {
        root /usr/share/nginx/html;
        try_files /unauthorized.html =401;
    }

    # Dynamic app routes written by deploykit at runtime.
    include /etc/nginx/app-locations/*.conf;

    # Deploykit control-plane API, prefixed form. Consumed by non-interactive
    # clients (CLI/VS Code/MCP) that can't do a browser OAuth flow — exempted
    # from auth at the oauth2-proxy layer via --skip-auth-route, not here.
    #
    # Resolved via Docker DNS at request time (resolver + variable), not at
    # nginx startup — a plain `proxy_pass http://deploykit:8011/;` would make
    # nginx refuse to start at all if the `deploykit` container doesn't exist
    # yet, which is exactly the order bootstrap-sandbox.sh starts them in on a
    # first-ever install (nginx before the control-plane container).
    #
    # NOTE (verified live — this was a real, previously-undetected bug):
    # nginx does NOT append the unmatched remainder of the request URI when
    # proxy_pass's target has a variable AND a static URI suffix — it
    # forwards exactly the literal suffix you wrote, discarding whatever
    # followed the location prefix. A trailing-slash-only suffix
    # (`proxy_pass http://$up/;`) therefore always requested bare "/" on the
    # backend regardless of the actual sub-path, silently. Fixed here with
    # `rewrite ... break;` to construct the stripped path explicitly, then a
    # bare `proxy_pass http://$up;` (no URI part) to forward it unchanged —
    # the standard correct pattern when the upstream must be resolved by a
    # variable.
    location /api/deploykit/ {
        set $deploykit_upstream "deploykit:8011";
        rewrite ^/api/deploykit/(.*)$ /$1 break;
        proxy_pass http://$deploykit_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Same control-plane API, unprefixed — this is what pacmanager's runtime
    # adapter and any other in-network caller hit directly. No prefix
    # stripping needed (client path already matches deploykit's own route),
    # so this uses the bare (no static URI suffix) proxy_pass form — see the
    # note on /api/deploykit/ above for why a suffixed variable proxy_pass
    # would silently drop the sub-path here too.
    location /api/v1/ {
        set $deploykit_upstream "deploykit:8011";
        proxy_pass http://$deploykit_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Internal .vsix distribution — private release only, no VS Code
    # Marketplace publish (see `deploykit manage`'s release screen, which
    # drops built .vsix files into this mounted directory).
    location /downloads/ {
        alias /srv/deploykit/vsix/;
        autoindex on;
    }

    # Catch-all (pacmanager) is generated at bootstrap time into the same
    # app-locations volume as per-app routes (00-catchall.conf, sorts first
    # but order is irrelevant — "/" is the least-specific prefix and always
    # loses to a more specific `location ^~ /<app-id>` regardless of file
    # order). Not baked in statically here because it must carry
    # PAC_TRUSTED_PROXY_SECRET as a literal value (a `proxy_set_header` inside
    # a location block, which can't reference an arbitrary OS env var without
    # either nginx's envsubst-on-templates preprocessing — risky here since
    # this file is full of legitimate nginx $variables that must NOT be
    # touched by envsubst — or generating the file directly, which is what
    # bootstrap-sandbox.sh does, mirroring how auth.conf/deny.conf are
    # already generated for the same reason: a real value can't be baked
    # into the image at build time.
}
